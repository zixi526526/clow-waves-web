<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个人网页接入 · Digital Ripples</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #32322d; background: #fafafa; font: 16px/1.8 system-ui,sans-serif; }
    #background { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    main { position: relative; z-index: 1; max-width: 740px; margin: 0 auto; padding: 23vh 24px 80px; }
    h1 { font: 400 clamp(32px,6vw,56px)/1.3 Georgia,serif; letter-spacing: -.03em; }
    p { max-width: 500px; color: #6d6d64; }
    button, a { font: inherit; color: inherit; }
    button { border: 1px solid #ddddd7; border-radius: 8px; background: #fafafacc; padding: 7px 15px; cursor: pointer; }
    :focus-visible { outline: 2px solid #5757b5; outline-offset: 4px; }
  </style>
</head>
<body>
  <div id="background" aria-hidden="true"></div>
  <main>
    <h1>留一点空间，<br>让想法流动。</h1>
    <p>这里放你的网页内容。背景在文字后流动；点击空白处会激起波纹。第三次点击会出现一颗心。</p>
    <p data-ripple-ignore>链接、输入框和按钮会保持正常交互；需要整块忽略的内容可以添加 <code>data-ripple-ignore</code>。</p>
    <button id="heart" type="button">在页面中央激起爱心</button>
  </main>
  <script src="../dist/digital-ripples.js"></script>
  <script>
    const background = new DigitalRipples('#background', { preset: 'reference', shape: 'auto' });
    document.getElementById('heart').addEventListener('click', () => {
      const box = document.getElementById('background').getBoundingClientRect();
      background.ripple(box.width * .5, box.height * .5, { shape: 'heart' });
    });
    // 在 SPA 组件卸载时调用 background.destroy()。
  </script>
</body>
</html>
